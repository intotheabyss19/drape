[project]
name = "drape"
version = "0.2.0"
description = "Try on jewellery, glasses and watches from your own photos or 3D models, live on your webcam. Runs locally."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Yash Gupta" }]
requires-python = ">=3.10"
keywords = ["virtual try-on", "augmented reality", "mediapipe", "jewellery", "webcam"]
dependencies = [
    "mediapipe>=0.10.14",   # brings opencv-contrib-python
    "moderngl>=5.8",
    "numpy>=1.26",
    "scipy>=1.10",
    "trimesh>=4.0",
]

[project.optional-dependencies]
rembg = ["rembg[cpu]>=2.0"]   # better background removal for item photos on busy backgrounds

[project.scripts]
drape = "drape.cli:main"

[project.urls]
Repository = "https://github.com/intotheabyss19/drape"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
